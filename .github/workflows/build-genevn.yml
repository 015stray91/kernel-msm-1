name: AnyRealm Genevn Kernel Build

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      ksu_variant:
        description: "KernelSU variant"
        type: choice
        options:
          - KernelSU-Next
          - SukiSU
          - None
        default: "KernelSU-Next"
      add_susfs:
        description: "Add SUSFS"
        type: boolean
        default: true
      add_zeromount:
        description: "Add ZeroMount"
        type: boolean
        default: true
      add_overlayfs:
        description: "Add overlayfs support"
        type: boolean
        default: true
      add_kpm:
        description: "Add KPM (koto modules)"
        type: boolean
        default: true

env:
  TZ: America/Chicago
  KBUILD_BUILD_USER: "015stray91"
  KBUILD_BUILD_HOST: "anyrealm-builder"
  CLANG_VERSION: "clang-r416183b"
  CLANG_URL: "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/bd96dfe349c962681f0e5388af874c771ef96670/clang-r416183b.tar.gz"
  GCC_URL: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/heads/main.tar.gz"

jobs:
  build:
    name: "Build Genevn Kernel - AnyRealm Matrix"
    runs-on: ubuntu-22.04

    steps:
      - name: Free Disk Space
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_tool_cache: true

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev \
            cpio kmod python3 lz4 liblz4-tool \
            libncurses-dev rsync zip curl wget jq \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            device-tree-compiler

      - name: Download AOSP Clang r416183b + GCC Toolchains
        run: |
          mkdir -p ${{ github.workspace }}/toolchain

          echo "=== Downloading clang-r416183b ==="
          wget -q "${{ env.CLANG_URL }}" -O /tmp/clang.tar.gz
          mkdir -p ${{ github.workspace }}/toolchain/${{ env.CLANG_VERSION }}
          tar -xf /tmp/clang.tar.gz -C ${{ github.workspace }}/toolchain/${{ env.CLANG_VERSION }}
          rm /tmp/clang.tar.gz

          echo "=== Downloading AOSP GCC aarch64 ==="
          wget -q "${{ env.GCC_URL }}" -O /tmp/gcc.tar.gz
          mkdir -p ${{ github.workspace }}/toolchain/aarch64-linux-android-4.9
          tar -xf /tmp/gcc.tar.gz -C ${{ github.workspace }}/toolchain/aarch64-linux-android-4.9
          rm /tmp/gcc.tar.gz

          echo "=== Verifying toolchains ==="
          ${{ github.workspace }}/toolchain/${{ env.CLANG_VERSION }}/bin/clang --version
          ${{ github.workspace }}/toolchain/aarch64-linux-android-4.9/bin/aarch64-linux-android-gcc --version || echo "GCC not at expected path, checking..."
          find ${{ github.workspace }}/toolchain/aarch64-linux-android-4.9 -name "aarch64-linux-android-gcc" -o -name "aarch64-*-gcc" 2>/dev/null | head -3

      - name: Checkout Kernel Source
        run: |
          git clone --depth=1 \
            -b android-14-release-u1tgns34.42-86-2-32 \
            https://github.com/015stray91/kernel-msm-1.git \
            kernel-source

      - name: Clone Device Tree
        run: |
          mkdir -p kernel-source/arch/arm64/boot/dts/vendor
          git clone --depth=1 \
            https://github.com/015stray91/kernel-devicetree.git \
            kernel-source/arch/arm64/boot/dts/vendor

      - name: Fix SUBLEVEL to 218
        working-directory: kernel-source
        run: |
          sed -i 's/^SUBLEVEL = .*/SUBLEVEL = 218/' Makefile
          echo "=== Makefile version after fix ==="
          head -5 Makefile

      - name: Apply Patches
        working-directory: kernel-source
        run: |
          echo "=== Applying kernel patches ==="
          chmod +x scripts/kconfig/apply-kernel-patches.sh 2>/dev/null || true
          if [ -d "KernelSU-Next/Ksu-patches" ]; then
            ./scripts/kconfig/apply-kernel-patches.sh . "5.10" KernelSU-Next/Ksu-patches/ || true
          fi

      - name: Build Merged Defconfig
        working-directory: kernel-source
        run: |
          echo "=== Building merged defconfig (AnyRealm consolidate chain) ==="

          TOOLCHAIN="${{ github.workspace }}/toolchain/${{ env.CLANG_VERSION }}"
          GCC_TOOLCHAIN="${{ github.workspace }}/toolchain/aarch64-linux-android-4.9"
          export PATH="${TOOLCHAIN}/bin:${GCC_TOOLCHAIN}/bin:${PATH}"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC="clang"
          export LD="ld.lld"
          export AR="llvm-ar"
          export NM="llvm-nm"
          export OBJCOPY="llvm-objcopy"
          export OBJDUMP="llvm-objdump"
          export STRIP="llvm-strip"
          export LLVM=1
          export LLVM_IAS=1

          mkdir -p out

          echo "[1/5] Listing available defconfigs..."
          ls arch/arm64/configs/ | head -20

          echo "[2/5] Merging base config stack via merge_config.sh..."
          ./scripts/kconfig/merge_config.sh -m -O out \
            arch/arm64/configs/ksu-nh.defconfig \
            arch/arm64/configs/vendor/parrot_consolidate.config \
            arch/arm64/configs/vendor/ext_config/moto-parrot.config \
            arch/arm64/configs/vendor/ext_config/debug_moto_parrot_genevn.config

          echo "[3/5] Applying feature toggles..."
          if [ "${{ inputs.add_overlayfs }}" = "true" ]; then
            echo "CONFIG_OVERLAY_FS=y" >> out/.config
            echo "CONFIG_SYSFS_OVERLAY=y" >> out/.config
          fi
          if [ "${{ inputs.add_zeromount }}" = "true" ]; then
            echo "CONFIG_ZEROMOUNT=y" >> out/.config
          fi
          if [ "${{ inputs.add_susfs }}" = "true" ]; then
            echo "CONFIG_KSU_SUSFS=y" >> out/.config
            echo "CONFIG_KSU_SUSFS_HAS_MEM_PAGES=y" >> out/.config
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> out/.config
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> out/.config
            echo "CONFIG_KSU_SUSFS_SPOOF_KSTAT=y" >> out/.config
            echo "CONFIG_KSU_SUSFS_OPENAT=y" >> out/.config
            echo "CONFIG_KSU_SUSFS_OPENAT2=y" >> out/.config
            echo "CONFIG_KSU_SUSFS_STAT=y" >> out/.config
            echo "CONFIG_KSU_SUSFS_GETDENTS=y" >> out/.config
            echo "CONFIG_KSU_SUSFS_ZERO_MOUNT=y" >> out/.config
          fi
          if [ "${{ inputs.add_kpm }}" = "true" ]; then
            echo "CONFIG_KPROBES=y" >> out/.config
            echo "CONFIG_KPROBE_EVENTS=y" >> out/.config
          fi

          echo "[4/5] Running olddefconfig to resolve dependencies..."
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            olddefconfig

          echo "[5/5] Config complete ==="
          wc -l out/.config

          echo "=== Verifying critical flags preserved ==="
          for flag in CONFIG_ANDROID_BINDER_IPC CONFIG_ANDROID_BINDERFS CONFIG_CGROUPS CONFIG_MEMCG CONFIG_EROFS_FS CONFIG_IKCONFIG CONFIG_BPF_SYSCALL CONFIG_SECCOMP CONFIG_KSU_SUSFS CONFIG_ZEROMOUNT CONFIG_OVERLAY_FS CONFIG_KPROBES; do
            if grep -q "^${flag}=y" out/.config; then
              echo "  PASS: ${flag}=y"
            else
              echo "  FAIL: ${flag} MISSING"
            fi
          done

      - name: Compile Kernel
        working-directory: kernel-source
        run: |
          TOOLCHAIN="${{ github.workspace }}/toolchain/${{ env.CLANG_VERSION }}"
          GCC_TOOLCHAIN="${{ github.workspace }}/toolchain/aarch64-linux-android-4.9"
          export PATH="${TOOLCHAIN}/bin:${GCC_TOOLCHAIN}/bin:${PATH}"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC="clang"
          export LD="ld.lld"
          export AR="llvm-ar"
          export NM="llvm-nm"
          export OBJCOPY="llvm-objcopy"
          export OBJDUMP="llvm-objdump"
          export STRIP="llvm-strip"
          export LLVM=1
          export LLVM_IAS=1

          echo "=== Building kernel Image.gz ==="
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC="clang" \
            LD="ld.lld" \
            AR="llvm-ar" \
            NM="llvm-nm" \
            OBJCOPY="llvm-objcopy" \
            OBJDUMP="llvm-objdump" \
            STRIP="llvm-strip" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 \
            LLVM_IAS=1 \
            Image.gz 2>&1 | tee ../build.log

          echo "=== Build complete ==="
          ls -la out/arch/arm64/boot/Image.gz 2>/dev/null || echo "WARNING: Image.gz not found"

      - name: Build DTBO
        working-directory: kernel-source
        if: always()
        run: |
          TOOLCHAIN="${{ github.workspace }}/toolchain/${{ env.CLANG_VERSION }}"
          export PATH="${TOOLCHAIN}/bin:${PATH}"

          if [ -d "out/arch/arm64/boot/dts" ]; then
            mkdir -p out/arch/arm64/boot/dist
            find out/arch/arm64/boot/dts/ -name "*.dtbo" -print0 | \
              xargs -0 python3 tools/libufdt/utils/src/mkdtboimg.py create \
                out/arch/arm64/boot/dtbo.img --page_size=4096 || true
          fi

      - name: Validate Build
        if: always()
        run: |
          echo "=== Validation ==="
          if [ -f "kernel-source/out/arch/arm64/boot/Image.gz" ]; then
            echo "PASS: Image.gz exists"
            ls -lh kernel-source/out/arch/arm64/boot/Image.gz
          else
            echo "FAIL: Image.gz missing"
            echo "=== Last 50 lines of build log ==="
            tail -50 kernel-source/build.log 2>/dev/null
            exit 1
          fi

      - name: Package Boot Image
        working-directory: kernel-source
        if: success()
        run: |
          echo "=== Packaging boot.img ==="
          if [ -d "packages" ]; then
            chmod +x packages/*.sh || true
            ./packages/build_boot_image.sh out/arch/arm64/boot/Image.gz || true
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AnyRealm-Genevn-Kernel-${{ github.run_number }}
          path: |
            kernel-source/out/arch/arm64/boot/Image.gz
            kernel-source/out/arch/arm64/boot/Image
            kernel-source/out/arch/arm64/boot/dtbo.img
            kernel-source/out/boot.img
            kernel-source/build.log
          compression-level: 9
          overwrite: true
